<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz — FlowState</title>
  <link rel="stylesheet" href="styles.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">⚡ <span>FlowState</span></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="superpowers.html">Superpowers</a>
      <a href="resources.html">Resources</a>
      <a href="quiz.html" class="active">Quiz</a>
      <a href="login.html">Login</a>
    </div>
  </nav>

  <main class="page-content quiz-page">

    <!-- QUIZ -->
    <div id="quiz-container">
      <div class="page-label" id="quiz-label">FIND YOUR FLOW — QUESTION 1 OF 3</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <h2 class="quiz-question" id="quiz-question"></h2>
      <div class="quiz-options" id="quiz-options"></div>
    </div>

    <!-- RESULT -->
    <div id="quiz-result" class="hidden">
      <div class="result-icon" id="result-icon"></div>
      <div class="page-label" id="result-label">YOUR FLOW PROFILE</div>
      <h2 class="result-name" id="result-name"></h2>
      <div class="result-card" id="result-card">
        <p id="result-tip"></p>
        <div id="result-sound"></div>
      </div>
      <button class="btn-secondary" id="retake-btn">Retake Quiz</button>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
